{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "typesense-snapshot-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "typesense-snapshot-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "typesense-snapshot-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Typesense HTTP API within the same namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app: typesense
      ports:
        - port: {{ .Values.typesense.port }}
          protocol: TCP
    # Kubernetes API server (required for client-go and leader election)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
